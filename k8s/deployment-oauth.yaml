# OpenShift deployment with OAuth proxy for Bearer token authentication
# 
# This deployment configures the kubernetes-mcp-server with OpenShift OAuth proxy
# to enable Bearer token authentication per the MCP specification.
#
# Key features:
# - OAuth proxy validates Bearer tokens against OpenShift's OAuth server
# - Uses --openshift-delegate-urls for Bearer token delegation
# - Requires system:auth-delegator permissions for the service account
# - Passes validated Bearer tokens to the upstream MCP server
#
# Usage:
# 1. Replace NAMESPACE_PLACEHOLDER with your target namespace
# 2. Apply: oc apply -f deployment-oauth.yaml -n <namespace>
# 3. Test Bearer tokens with: scripts/test-oauth.sh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-mcp-server
  annotations:
    serviceaccounts.openshift.io/oauth-redirectreference.kubernetes-mcp-server: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"kubernetes-mcp-server"}}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp-server
  namespace: NAMESPACE_PLACEHOLDER
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp-server-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: kubernetes-mcp-server
  namespace: NAMESPACE_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  labels:
    app: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      containers:
      - name: kubernetes-mcp-server
        image: quay.io/cfchase/kubernetes-mcp-server:latest
        command: ["/app/kubernetes-mcp-server"]
        args: ["--port", "8080"]
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: oauth-proxy
        image: quay.io/openshift/origin-oauth-proxy:4.16
        ports:
        - containerPort: 8443
          protocol: TCP
        args:
        - --https-address=:8443
        - --provider=openshift
        - --openshift-service-account=kubernetes-mcp-server
        - --upstream=http://localhost:8080
        - --tls-cert=/etc/tls/private/tls.crt
        - --tls-key=/etc/tls/private/tls.key
        - --cookie-secret=SECRET
        - --cookie-expire=24h0m0s
        - --cookie-refresh=1h0m0s
        - --cookie-samesite=strict
        - --cookie-httponly=true
        - --email-domain=*
        - --skip-provider-button=true
        - --pass-access-token=true
        - --pass-user-headers=true
        - --set-xauthrequest=true
        - --openshift-delegate-urls={"/":{"resource":"namespaces","verb":"list"}}
        - --openshift-sar={"resource":"namespaces","verb":"list"}
        - --pass-user-bearer-token=true
        - --request-logging=true
        volumeMounts:
        - name: proxy-tls
          mountPath: /etc/tls/private
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /oauth/healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /oauth/healthz
            port: 8443
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: proxy-tls
        secret:
          secretName: kubernetes-mcp-server-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: kubernetes-mcp-server-proxy-tls
  labels:
    app: kubernetes-mcp-server
spec:
  selector:
    app: kubernetes-mcp-server
  ports:
  - name: oauth-proxy
    port: 8443
    targetPort: 8443
    protocol: TCP
  - name: mcp-server
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubernetes-mcp-server
  labels:
    app: kubernetes-mcp-server
spec:
  to:
    kind: Service
    name: kubernetes-mcp-server
  port:
    targetPort: oauth-proxy
  tls:
    termination: reencrypt
    destinationCACertificate: ""